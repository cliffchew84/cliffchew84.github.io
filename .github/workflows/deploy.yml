name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble site
        run: |
          rm -rf site
          mkdir -p site

          # Portfolio at root — use profile/ as stopgap until portfolio/ exists
          cp -r profile/* site/

          # Also keep /profile/ working for legacy links
          cp -r profile site/profile

          # Talks at /talks/
          cp -r talks site/talks

          # Disable Jekyll so static files are served as-is
          touch site/.nojekyll

          echo "=== site tree ==="
          find site -type f | sort

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4