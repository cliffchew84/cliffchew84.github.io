name: Build content.json

on:
  push:
    branches: [main]
    paths:
      - 'content/**/*.md'
      - 'scripts/build-content.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Build content.json
        run: python scripts/build-content.py

      - name: Commit content.json if changed
        run: |
          git config user.name 'github-actions'
          git config user.email 'github-actions@github.com'
          if ! git diff --quiet content/content.json; then
            git add content/content.json
            git commit -m 'chore: update content.json from markdown'
            git push
          else
            echo 'content.json unchanged'
          fi