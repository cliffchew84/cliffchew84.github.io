<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Town — Horizontal Prototype, Redesigned</title>
<script>
try { if (localStorage.getItem('night') === '1') document.documentElement.classList.add('night'); } catch (e) {}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Ubuntu:ital,wght@0,300;0,400;0,500;0,700;1,400&display=swap">
<link rel="stylesheet" href="style.css" />
<link rel="icon" href="assets/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16.png">
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="icon" type="image/png" sizes="48x48" href="assets/favicon-48.png">
<link rel="icon" type="image/png" sizes="64x64" href="assets/favicon-64.png">
<link rel="apple-touch-icon" href="assets/favicon-64.png">
<link rel="preload" as="image" href="assets/residence-new.webp">
<link rel="preload" as="image" href="assets/character-idle.webp">

</head>
<body>

<a class="skip-link" href="#panel">Skip to content</a>

<div class="town-strip" id="strip">
  <div class="hero-title">
    <h1>Cliff's Town</h1>
    <p>A walkable portfolio — pick a building, read its scroll.</p>
  </div>
  <button class="night-toggle" id="night-toggle" aria-pressed="false">🌙 Night</button>
  <button class="town-arrow prev" id="town-prev" aria-label="Previous building">‹</button>
  <button class="town-arrow next" id="town-next" aria-label="Next building">›</button>
  <div class="buildings-row">
    <!-- Buttons built by script.js from content.json -->
  </div>
  <div class="character-wrap" id="char"><div class="character" id="char-el"></div></div>
</div>

<main class="main-panel">
  <div class="scroll-stage" id="scroll-stage">
    <div class="roll-top" aria-hidden="true"></div>
    <!-- Fallback content. script.js replaces this on load. -->
    <article class="parchment" id="panel" tabindex="-1" aria-live="polite">
      <header class="panel-header">
        <div class="panel-title-group">
          <h2 id="panel-title">Residence</h2>
          <p class="panel-intro" id="panel-intro" hidden></p>
          <p class="panel-sub-line">
            <span id="panel-sub">Resume · Profile</span>
            <span class="panel-sub-sep" id="panel-sub-sep" aria-hidden="true" hidden>·</span>
            <span class="panel-count" id="panel-count" role="status" aria-live="polite" hidden></span>
          </p>
        </div>
      </header>
      <div class="scroll-filters" id="scroll-filters" hidden>
        <div class="scroll-chips" id="scroll-chips" role="group" aria-label="Filter by topic"></div>
        <div class="scroll-search">
          <svg class="scroll-search-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <circle cx="11" cy="11" r="7"></circle>
            <path d="m20 20-4-4"></path>
          </svg>
          <label class="visually-hidden" for="scroll-query">Search this section</label>
          <input id="scroll-query" type="search" placeholder="Search this section" autocomplete="off" spellcheck="false" />
          <button class="scroll-search-clear" id="scroll-clear" type="button" aria-label="Clear search" hidden>×</button>
        </div>
        <nav class="pagination-nav" id="panel-pager" aria-label="Scroll pages" hidden></nav>
        <p class="scroll-filter-status" id="scroll-filter-status" hidden>
          <span id="scroll-filter-count" role="status" aria-live="polite"></span>
          <button type="button" id="scroll-filter-clear" hidden>Clear</button>
        </p>
      </div>
      <div class="panel-body" id="panel-body">
        <p>I turn messy public data into clear tools. I write and speak about the craft. Ten years of pipelines and dashboards.</p>
      </div>
    </article>
    <div class="roll-rod" aria-hidden="true"></div>
  </div>

</main>

<div class="internal-badge" id="internal-badge" hidden>Internal</div>

<script src="script.js"></script>
</body>
</html>
