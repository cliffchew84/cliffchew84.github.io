<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%232563eb' d='M10 4H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-8z'/%3E%3C/svg%3E">
  <title>HomeNAS File Browser</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #f5f5f5; --surface: #fff; --text: #1a1a1a; --muted: #666;
      --primary: #2563eb; --primary-h: #1d4ed8; --border: #e5e5e5;
      --error: #dc2626; --error-bg: #fef2f2; --radius: 8px;
      --shadow: 0 1px 3px rgba(0,0,0,.1);
    }
    body { font: 14px/1.5 system-ui, sans-serif; background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column; }
    header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 10; }
    header h1 { font-size: 1.1rem; font-weight: 600; }
    .user { font-size: .85rem; color: var(--muted); background: var(--bg); padding: 4px 10px; border-radius: 999px; }
    main { flex: 1; display: flex; overflow: hidden; }
    aside { width: 280px; border-right: 1px solid var(--border); background: var(--surface); overflow: auto; padding: 8px; flex-shrink: 0; }
    .tree { list-style: none; }
    .tree li { margin: 2px 0; }
    .tree button { width: 100%; text-align: left; padding: 6px 10px; border: none; background: none; border-radius: 4px; cursor: pointer; font: inherit; color: var(--text); display: flex; align-items: center; gap: 6px; }
    .tree button:hover { background: var(--bg); }
    .tree button.active { background: var(--primary); color: white; }
    .tree .children { margin-left: 16px; display: none; }
    .tree .open > .children { display: block; }
    .tree .folder { font-weight: 500; }
    .tree .tree-group { margin: 12px 0 4px; padding: 0 10px; font-size: .68rem; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); }
    .tree .tree-group:first-child { margin-top: 4px; }
    .tree .caret { display: inline-block; width: 10px; font-size: .65rem; color: var(--muted); transition: transform .15s; }
    .tree .open > button .caret { transform: rotate(90deg); }
    .tree button:disabled { color: var(--muted); cursor: default; }
    .tree button:disabled:hover { background: none; }
    section { flex: 1; padding: 16px; overflow: auto; }
    .breadcrumb { display: flex; gap: 4px; margin-bottom: 16px; font-size: .85rem; color: var(--muted); flex-wrap: wrap; }
    .breadcrumb a { color: var(--primary); text-decoration: none; }
    .breadcrumb a:hover { text-decoration: underline; }
    .breadcrumb .sep { color: var(--muted); }
    .toolbar { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
    .btn { padding: 8px 14px; border: 1px solid var(--border); background: var(--surface); border-radius: var(--radius); cursor: pointer; font: inherit; display: inline-flex; align-items: center; gap: 6px; }
    .btn:hover { background: var(--bg); }
    .btn.primary { background: var(--primary); border-color: var(--primary); color: white; }
    .btn.primary:hover { background: var(--primary-h); }
    .btn:disabled { opacity: .5; cursor: not-allowed; }
    table { width: 100%; border-collapse: collapse; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
    th, td { padding: 10px 12px; text-align: left; border-bottom: 1px solid var(--border); }
    th { background: var(--bg); font-weight: 600; font-size: .8rem; text-transform: uppercase; color: var(--muted); }
    tr:hover { background: var(--bg); }
    tr.selected { background: #eff6ff; }
    tr.deleting { opacity: .45; }
    tr.deleting td { pointer-events: none; }
    .name { display: flex; align-items: center; gap: 8px; }
    .icon { width: 18px; height: 18px; flex-shrink: 0; }
    .actions button { margin-left: 4px; padding: 4px 8px; font-size: .75rem; }
    .empty { text-align: center; padding: 40px; color: var(--muted); }
    .modal { position: fixed; inset: 0; background: rgba(0,0,0,.4); display: flex; align-items: center; justify-content: center; z-index: 100; }
    .modal.hidden { display: none; }
    .modal-content { background: var(--surface); padding: 24px; border-radius: var(--radius); min-width: 320px; box-shadow: var(--shadow); }
    .modal-content h3 { margin-bottom: 16px; }
    .modal-content input { width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: var(--radius); margin-bottom: 12px; font: inherit; }
    .modal-footer { display: flex; justify-content: flex-end; gap: 8px; }
    .alert { position: fixed; bottom: 20px; right: 20px; padding: 12px 16px; border-radius: var(--radius); background: var(--error-bg); color: var(--error); border: 1px solid #fecaca; z-index: 200; animation: slide .2s; }
    .alert.hidden { display: none; }
    @keyframes slide { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    .upload-input { display: none; }
  </style>
</head>
<body>
  <header>
    <h1>HomeNAS</h1>
    <span class="user" id="userBadge">admin</span>
  </header>
  <main>
    <aside>
      <ul class="tree" id="folderTree"></ul>
    </aside>
    <section>
      <nav class="breadcrumb" id="breadcrumb"></nav>
      <div class="toolbar">
        <button class="btn primary" id="uploadBtn">Upload</button>
        <input type="file" class="upload-input" id="fileInput" multiple>
        <button class="btn" id="newFolderBtn">New Folder</button>
        <button class="btn" id="deleteSelectedBtn" disabled>Delete Selected</button>
      </div>
      <table id="fileTable">
        <thead>
          <tr>
            <th style="width: 40px;"><input type="checkbox" id="selectAll"></th>
            <th>Name</th>
            <th style="width: 120px;">Size</th>
            <th style="width: 160px;">Modified</th>
            <th style="width: 100px;">Type</th>
            <th style="width: 170px;">Actions</th>
          </tr>
        </thead>
        <tbody id="fileList"></tbody>
      </table>
    </section>
  </main>

  <div class="modal hidden" id="modal">
    <div class="modal-content">
      <h3 id="modalTitle"></h3>
      <input type="text" id="modalInput" placeholder="Folder name">
      <div class="modal-footer">
        <button class="btn" id="modalCancel">Cancel</button>
        <button class="btn primary" id="modalConfirm">OK</button>
      </div>
    </div>
  </div>
  <div class="alert hidden" id="toast"></div>

  <script>
    // ====== CONFIG - EDIT THESE ======
    const PROXY_URL = 'http://localhost:3001';  // proxy -> NAS
    const DEFAULT_USER = 'admin';
    const DEFAULT_PASS = 'Cliffchew88456788';

    // ====== STATE ======
    let cookie = '';
    let currentPath = '/home';
    let selection = new Set();
    let pendingDeletes = new Set();
    let modalResolve = null;

    // ====== DOM ======
    const folderTree = document.getElementById('folderTree');
    const breadcrumb = document.getElementById('breadcrumb');
    const fileList = document.getElementById('fileList');
    const selectAll = document.getElementById('selectAll');
    const fileInput = document.getElementById('fileInput');
    const modal = document.getElementById('modal');
    const modalTitle = document.getElementById('modalTitle');
    const modalInput = document.getElementById('modalInput');
    const toast = document.getElementById('toast');

    // ====== API ======
    async function api(module, method, params = {}) {
      console.log('API call:', module, method, params);
      const res = await fetch(`${PROXY_URL}/${module}/${method}`, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          // Browsers forbid setting Cookie directly, so send the token here.
          // The proxy converts it to the authorization_code cookie the NAS expects.
          'Authorization': cookie ? `Bearer ${cookie}` : ''
        },
        body: JSON.stringify(params)
      });
      console.log('Response status:', res.status);
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const data = await res.json();
      console.log('Response data:', data);
      if (data.error) throw new Error(data.error.msg || data.error);
      if (data.result === false) throw new Error(data.error?.msg || 'Request failed');
      return data.data;
    }

    async function login() {
      try {
        const data = await api('auth', 'auth', { username: DEFAULT_USER, password: DEFAULT_PASS });
        cookie = data.access_token;
        document.getElementById('userBadge').textContent = DEFAULT_USER + ' (admin)';
        return true;
      } catch (e) {
        showToast('Login failed: ' + e.message);
        return false;
      }
    }

    // ====== FILE SYSTEM (life API) ======
    // /life/v1/folder returns both folders and files with size and date.
    async function fsList(path) {
      const query = {
        root: 'local',
        path,
        option: {
          offset: 0,
          limit: 500,
          order: 'name',
          reverse: false,
          filter: [{ key: 'subtype', equal: false, value: 'hidden' }]
        }
      };
      const res = await fetch(`${PROXY_URL}/life/v1/folder?query=${encodeURIComponent(JSON.stringify(query))}`, {
        headers: { 'Authorization': cookie ? `Bearer ${cookie}` : '' }
      });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const data = await res.json();
      if (!data.result) throw new Error(data.error?.msg || data.error || 'Request failed');
      return data.data.items || [];
    }

    // SMB exposes shares by display name, so match Finder.
    function itemLabel(item) {
      return (item.option && item.option.share && item.option.share.display_name) || item.name;
    }

    function shareType(item) {
      const share = item.option && item.option.share;
      return (share && share.type) || (item.subtype && item.subtype[0]) || '';
    }

    // Group shares the way a user thinks about them, not in filesystem order.
    const TREE_GROUPS = [
      { label: 'Personal', types: ['home', 'vphome'] },
      { label: 'Shared folders', types: ['internal'] },
      { label: 'User homes', types: ['homes'] },
      { label: 'System', types: ['system'] }
    ];

    function byLabel(a, b) {
      return itemLabel(a).localeCompare(itemLabel(b), undefined, { sensitivity: 'base' });
    }

    function addTreeGroup(label, items) {
      if (!items.length) return;
      const header = document.createElement('li');
      header.className = 'tree-group';
      header.textContent = label;
      folderTree.appendChild(header);
      items.sort(byLabel).forEach(item => addTreeNode(itemLabel(item), item.path, folderTree));
    }

    // ====== TREE (share folders) ======
    async function loadTree() {
      const items = await fsList('/');
      const folders = items.filter(item => item.type === 'folder');
      folderTree.innerHTML = '';

      const grouped = new Set();
      TREE_GROUPS.forEach(group => {
        const groupItems = folders.filter(item => group.types.includes(shareType(item)));
        groupItems.forEach(item => grouped.add(item));
        addTreeGroup(group.label, groupItems);
      });

      addTreeGroup('Other', folders.filter(item => !grouped.has(item)));
    }

    function addTreeNode(name, path, container) {
      const li = document.createElement('li');
      li.className = 'folder';
      li.innerHTML = `
        <button data-path="${escapeHtml(path)}" aria-expanded="false">
          <span class="caret">▸</span>
          <span class="icon">${svgFolder()}</span>
          ${escapeHtml(name)}
        </button>
        <ul class="children"></ul>
      `;
      const btn = li.querySelector('button');
      const childrenUl = li.querySelector('.children');
      let loaded = false;

      btn.addEventListener('click', async () => {
        const isOpen = li.classList.toggle('open');
        btn.setAttribute('aria-expanded', String(isOpen));
        selectPath(path);

        if (!isOpen || loaded) return;
        loaded = true;
        childrenUl.innerHTML = '<li><button disabled>Loading…</button></li>';
        try {
          const items = await fsList(path);
          const names = items.filter(item => item.type === 'folder' && !item.name.startsWith('.'));
          childrenUl.innerHTML = '';
          if (!names.length) {
            childrenUl.innerHTML = '<li><button disabled>No subfolders</button></li>';
            return;
          }
          names.forEach(item => addTreeNode(itemLabel(item), item.path || `${path}/${item.name}`, childrenUl));
        } catch (e) {
          loaded = false; // allow a retry on the next click
          childrenUl.innerHTML = '<li><button disabled>Error</button></li>';
        }
      });
      container.appendChild(li);
    }

    // ====== FILE LIST ======
    async function loadFiles(path) {
      currentPath = path;
      updateBreadcrumb(path);
      selection.clear();
      selectAll.checked = false;
      fileList.innerHTML = '<tr><td colspan="6" class="empty">Loading…</td></tr>';
      try {
        const items = await fsList(path);
        renderFiles(items, path);
      } catch (e) {
        fileList.innerHTML = '<tr><td colspan="6" class="empty">Error: ' + escapeHtml(e.message) + '</td></tr>';
      }
    }

    function renderFiles(items, path) {
      const visible = items.filter(item => !item.name.startsWith('.'));
      if (!visible.length) {
        fileList.innerHTML = '<tr><td colspan="6" class="empty">Empty folder</td></tr>';
        return;
      }
      fileList.innerHTML = visible.map(item => {
        const fullPath = item.path || `${path === '/' ? '' : path}/${item.name}`;
        const isFolder = item.type === 'folder';
        const label = itemLabel(item);
        const realName = label === item.name ? '' : ` title="Folder name: ${escapeHtml(item.name)}"`;
        const canModify = path !== '/';
        const pending = pendingDeletes.has(fullPath);
        return `
        <tr${pending ? ' class="deleting"' : ''} data-name="${escapeHtml(label)}" data-path="${escapeHtml(fullPath)}" data-type="${isFolder ? 'folder' : 'file'}">
          <td><input type="checkbox" class="row-check" value="${escapeHtml(fullPath)}"${pending ? ' disabled' : ''}></td>
          <td class="name"${realName}>
            <span class="icon">${isFolder ? svgFolder() : svgFile(item.name)}</span>
            ${escapeHtml(label)}
          </td>
          <td>${isFolder ? '—' : formatSize(item.size)}</td>
          <td>${formatDate(item.access_date)}</td>
          <td class="type">${pending ? 'Deleting…' : isFolder ? 'Folder' : fileType(item.name)}</td>
          <td class="actions">
            ${canModify ? `
              <button class="btn" onclick="renameItem('${escapeHtml(fullPath)}', '${escapeHtml(label)}')"${pending ? ' disabled' : ''}>Rename</button>
              <button class="btn" onclick="deleteItem('${escapeHtml(fullPath)}')"${pending ? ' disabled' : ''}>Delete</button>
            ` : '—'}
          </td>
        </tr>
      `;
      }).join('');
      bindRowEvents();
    }

    function bindRowEvents() {
      fileList.querySelectorAll('.row-check').forEach(cb => {
        cb.addEventListener('change', updateSelection);
      });
      fileList.querySelectorAll('tr').forEach(row => {
        row.addEventListener('dblclick', (e) => {
          if (e.target.tagName === 'INPUT' || e.target.tagName === 'BUTTON') return;
          if (row.dataset.type !== 'folder') return;
          selectPath(row.dataset.path);
        });
      });
    }

    function updateSelection() {
      selection.clear();
      fileList.querySelectorAll('.row-check:checked').forEach(cb => selection.add(cb.value));
      selectAll.checked = selection.size > 0 && selection.size === fileList.querySelectorAll('.row-check').length;
      document.getElementById('deleteSelectedBtn').disabled = selection.size === 0;
      fileList.querySelectorAll('tr').forEach(row => {
        row.classList.toggle('selected', selection.has(row.dataset.path));
      });
    }

    selectAll.addEventListener('change', () => {
      fileList.querySelectorAll('.row-check').forEach(cb => cb.checked = selectAll.checked);
      updateSelection();
    });

    // ====== BREADCRUMB ======
    function updateBreadcrumb(path) {
      const parts = path.split('/').filter(Boolean);
      const crumbs = [{ label: 'Home', path: '/' }];
      let acc = '';
      parts.forEach(part => {
        acc += '/' + part;
        crumbs.push({ label: part, path: acc });
      });
      breadcrumb.innerHTML = crumbs.map((c, i) =>
        `${i ? '<span class="sep">/</span>' : ''}<a data-path="${escapeHtml(c.path)}">${escapeHtml(c.label)}</a>`
      ).join('');
      breadcrumb.querySelectorAll('a').forEach(a =>
        a.addEventListener('click', () => selectPath(a.dataset.path)));
    }

    // ====== ACTIONS ======
    function selectPath(path) {
      folderTree.querySelectorAll('button').forEach(b => b.classList.toggle('active', b.dataset.path === path));
      loadFiles(path);
    }

    // ====== CREATE / RENAME ======
    function validName(name) {
      return Boolean(name) && name !== '.' && name !== '..' && !name.includes('/');
    }

    function joinPath(base, name) {
      return (base === '/' ? '' : base) + '/' + name;
    }

    function parentOf(path) {
      const index = path.lastIndexOf('/');
      return index <= 0 ? '/' : path.slice(0, index);
    }

    async function createFolder(path, name) {
      const res = await fetch(`${PROXY_URL}/life/v1/folder`, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': cookie ? `Bearer ${cookie}` : ''
        },
        body: JSON.stringify({
          action: 'mkdir',
          items: { source: { root: 'local', path: joinPath(path, name) } }
        })
      });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const data = await res.json().catch(() => ({}));
      if (data.result === false) throw new Error(data.error || 'Create failed');
    }

    async function renamePath(path, name) {
      const target = joinPath(parentOf(path), name);
      if (target === path) return;
      const res = await fetch(`${PROXY_URL}/life/v1/folder`, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': cookie ? `Bearer ${cookie}` : ''
        },
        body: JSON.stringify({
          action: 'move', // a rename is a move to the same folder
          items: [{ source: { root: 'local', path }, target: { root: 'local', path: target } }]
        })
      });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const data = await res.json().catch(() => ({}));
      if (data.result === false) throw new Error(data.error || 'Rename failed');
    }

    async function refreshViews(path) {
      await loadFiles(path);
      try {
        await loadTree();
      } catch (e) {
        // keep the current tree if it cannot reload
      }
      folderTree.querySelectorAll('button').forEach(b => b.classList.toggle('active', b.dataset.path === currentPath));
      // The NAS may apply the change just after the response.
      setTimeout(() => {
        if (currentPath === path) loadFiles(path);
      }, 1000);
    }

    window.renameItem = (path, name) => {
      if (currentPath === '/') {
        showToast('Open a share or folder first.', 6000);
        return;
      }
      openModal('Rename', name, async (newName) => {
        if (!validName(newName)) {
          showToast('Invalid name. Do not use "/" or dots only.');
          return;
        }
        try {
          showToast('Renaming…');
          await renamePath(path, newName);
          await refreshViews(currentPath);
          showToast(`Renamed to ${newName}`);
        } catch (e) {
          showToast('Rename failed: ' + e.message, 8000);
        }
      });
    };

    // ====== DELETE ======
    async function deletePaths(paths) {
      const res = await fetch(`${PROXY_URL}/life/v1/folderex`, {
        method: 'DELETE',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': cookie ? `Bearer ${cookie}` : ''
        },
        body: JSON.stringify({
          action: 'delete',
          items: paths.map(path => ({ source: { root: 'local', path } }))
        })
      });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const data = await res.json().catch(() => ({}));
      if (data.result === false) throw new Error(data.error || 'Delete failed');
    }

    function markDeleting(paths) {
      fileList.querySelectorAll('tr').forEach(row => {
        if (!paths.includes(row.dataset.path)) return;
        row.classList.add('deleting');
        const typeCell = row.querySelector('.type');
        if (typeCell) typeCell.textContent = 'Deleting…';
        const check = row.querySelector('.row-check');
        if (check) {
          check.checked = false;
          check.disabled = true;
        }
        row.querySelectorAll('button').forEach(btn => { btn.disabled = true; });
      });
    }

    // The NAS removes items in a background task. Poll until the item is gone.
    async function waitUntilGone(path, paths, tries = 10, interval = 400) {
      for (let i = 0; i < tries; i++) {
        try {
          const items = await fsList(path);
          if (!items.some(item => paths.includes(item.path))) return true;
        } catch (e) {
          // keep waiting on a transient error
        }
        await new Promise(resolve => setTimeout(resolve, interval));
      }
      return false;
    }

    async function deleteAndRefresh(paths) {
      const path = currentPath;
      const hadFolder = [...fileList.querySelectorAll('tr')]
        .some(row => paths.includes(row.dataset.path) && row.dataset.type === 'folder');

      paths.forEach(p => pendingDeletes.add(p));
      markDeleting(paths);
      selection.clear();
      document.getElementById('deleteSelectedBtn').disabled = true;

      try {
        await deletePaths(paths);
      } catch (e) {
        paths.forEach(p => pendingDeletes.delete(p));
        if (currentPath === path) await loadFiles(path);
        throw e;
      }

      const gone = await waitUntilGone(path, paths);
      paths.forEach(p => pendingDeletes.delete(p));

      if (currentPath === path) await loadFiles(path);
      if (hadFolder) {
        loadTree().catch(() => {});
        folderTree.querySelectorAll('button').forEach(b => b.classList.toggle('active', b.dataset.path === currentPath));
      }
      return gone;
    }

    window.deleteItem = async (path) => {
      if (currentPath === '/') {
        showToast('Open a share or folder first.', 6000);
        return;
      }
      const name = path.split('/').pop();
      if (!confirm(`Delete "${name}"?`)) return;
      try {
        showToast('Deleting ' + name + '…', 60000);
        const gone = await deleteAndRefresh([path]);
        showToast(gone ? `Deleted ${name}` : `Delete of ${name} is still running on the NAS.`, gone ? 3000 : 8000);
      } catch (e) {
        showToast('Delete failed: ' + e.message, 8000);
      }
    };

    document.getElementById('deleteSelectedBtn').addEventListener('click', async () => {
      const paths = [...selection];
      if (!paths.length || !confirm(`Delete ${paths.length} item(s)?`)) return;
      try {
        showToast('Deleting ' + paths.length + ' item(s)…', 60000);
        const gone = await deleteAndRefresh(paths);
        showToast(gone ? `Deleted ${paths.length} item(s)` : `Delete is still running on the NAS.`, gone ? 3000 : 8000);
      } catch (e) {
        showToast('Delete failed: ' + e.message, 8000);
      }
    });

    // ====== UPLOAD ======
    const uploadBtn = document.getElementById('uploadBtn');

    async function uploadOne(file, path) {
      const form = new FormData();
      form.append('application/json', JSON.stringify({
        root: 'local',
        path,
        mtime: new Date(file.lastModified || Date.now()).toISOString(),
        size: file.size,
        filename: file.name
      }));
      // The NAS reads the file from the field named after the file itself.
      form.append(file.name, file, file.name);

      const res = await fetch(`${PROXY_URL}/life/v1/file/upload`, {
        method: 'POST',
        headers: { 'Authorization': cookie ? `Bearer ${cookie}` : '' },
        body: form
      });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const data = await res.json().catch(() => ({}));
      if (data.result === false) throw new Error(data.error || 'Upload failed');
    }

    async function uploadFiles(files) {
      if (currentPath === '/') {
        showToast('Open a share or folder before uploading.', 6000);
        return 0;
      }
      const targetPath = currentPath;
      const failed = [];
      let done = 0;
      for (let i = 0; i < files.length; i++) {
        uploadBtn.textContent = `Uploading ${i + 1}/${files.length}…`;
        try {
          await uploadOne(files[i], targetPath);
          done++;
        } catch (e) {
          failed.push(`${files[i].name}: ${e.message}`);
        }
      }
      await loadFiles(targetPath);
      // The NAS may index the new file just after the response.
      setTimeout(() => {
        if (currentPath === targetPath) loadFiles(targetPath);
      }, 1200);

      if (failed.length && done) {
        showToast(`Uploaded ${done} of ${files.length} to ${targetPath}. Failed: ${failed[0]}`, 8000);
      } else if (failed.length) {
        showToast(`Upload failed: ${failed[0]}`, 8000);
      } else {
        showToast(`Uploaded ${done} file(s) to ${targetPath}`);
      }
      return done;
    }

    uploadBtn.addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', async () => {
      const files = Array.from(fileInput.files);
      fileInput.value = '';
      if (!files.length) return;
      uploadBtn.disabled = true;
      try {
        await uploadFiles(files);
      } finally {
        uploadBtn.disabled = false;
        uploadBtn.textContent = 'Upload';
      }
    });

    // ====== NEW FOLDER ======
    document.getElementById('newFolderBtn').addEventListener('click', () => {
      if (currentPath === '/') {
        showToast('Open a share or folder first.', 6000);
        return;
      }
      openModal('New Folder', '', async (name) => {
        if (!validName(name)) {
          showToast('Invalid name. Do not use "/" or dots only.');
          return;
        }
        try {
          showToast('Creating ' + name + '…');
          await createFolder(currentPath, name);
          await refreshViews(currentPath);
          showToast(`Created ${name}`);
        } catch (e) {
          showToast('Create failed: ' + e.message, 8000);
        }
      });
    });

    // ====== MODAL ======
    function openModal(title, value, onConfirm) {
      modalTitle.textContent = title;
      modalInput.value = value;
      modal.classList.remove('hidden');
      modalInput.focus();
      modalResolve = onConfirm;
    }
    document.getElementById('modalCancel').addEventListener('click', () => { modal.classList.add('hidden'); modalResolve = null; });
    document.getElementById('modalConfirm').addEventListener('click', async () => {
      const val = modalInput.value.trim();
      if (!val) return;
      modal.classList.add('hidden');
      if (modalResolve) await modalResolve(val);
      modalResolve = null;
    });

    // ====== TOAST ======
    function showToast(msg, ms = 3000) {
      toast.textContent = msg;
      toast.classList.remove('hidden');
      clearTimeout(showToast.timer);
      showToast.timer = setTimeout(() => toast.classList.add('hidden'), ms);
    }

    // ====== UTIL ======
    function formatSize(size) {
      const n = Number(size);
      if (size === null || size === undefined || size === '' || Number.isNaN(n)) return '—';
      const units = ['B', 'KB', 'MB', 'GB', 'TB'];
      let value = n;
      let unit = 0;
      while (value >= 1024 && unit < units.length - 1) { value /= 1024; unit++; }
      return (unit === 0 ? value : value.toFixed(1)) + ' ' + units[unit];
    }

    function formatDate(iso) {
      if (!iso) return '—';
      const date = new Date(iso);
      if (Number.isNaN(date.getTime())) return '—';
      return date.toLocaleString();
    }

    function fileType(name) {
      const dot = name.lastIndexOf('.');
      if (dot < 0 || dot === name.length - 1) return 'File';
      return name.slice(dot + 1).toUpperCase() + ' file';
    }

    function escapeHtml(s) {
      const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
      return String(s).replace(/[&<>"']/g, c => map[c]);
    }
    function svgFolder() { return '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>'; }
    function svgFile(name) {
      const ext = name.split('.').pop().toLowerCase();
      const img = ['jpg','jpeg','png','gif','webp','svg'].includes(ext);
      const vid = ['mp4','webm','mov','mkv'].includes(ext);
      const pdf = ext === 'pdf';
      if (img) return '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M4 14h16M4 10h16"/></svg>';
      if (vid) return '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="23 7 16 12 23 17 23 7"/><rect x="2" y="3" width="20" height="14" rx="2"/></svg>';
      if (pdf) return '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>';
      return '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>';
    }

    // ====== INIT ======
    (async () => {
      const ok = await login();
      if (!ok) return;
      try {
        await loadTree();
      } catch (e) {
        showToast('Could not load folders: ' + e.message);
      }
      loadFiles('/home');
    })();
  </script>
</body>
</html>
